# 공개: Cloudflare Tunnel boardgame.shinkeonkim.com → Traefik. 게임 경로(/<게임id>)가 아닌 나머지 전부가 포털
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
spec:
  ingressClassName: traefik
  rules:
    - host: boardgame.shinkeonkim.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
