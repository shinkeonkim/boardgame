apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  # 포털은 상태 없는 정적 사이트 — 2개로 띄우고 평범한 롤링 업데이트
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &labels
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/shinkeonkim/boardgame-portal:latest
          ports:
            - name: http
              containerPort: 8080
            - name: metrics # 내부 전용 Prometheus 지표 (/metrics)
              containerPort: 9464
          env:
            # 관리자 페이지(/admin): Cloudflare Zero Trust에서 boardgame.shinkeonkim.com/admin 경로에 Access 앱을 만든 뒤
            # 팀 도메인과 그 앱의 AUD 태그를 넣는다. 비어 있으면 관리자 API는 503(꺼짐) — docs/admin.md
            - { name: CF_ACCESS_TEAM_DOMAIN, value: "crimson-firefly-8b7d.cloudflareaccess.com" }
            - { name: CF_ACCESS_AUD, value: "93f7341779e9750979880a506f3b24921cfd0944d027cef70eb95c8607bdea80" }
            # 게임 서버 내부 포트(관리자 API) 주소 — {id}가 게임 id로
            - { name: ADMIN_GAME_URL, value: "http://{id}.boardgame-{id}.svc.cluster.local:9464" }
            - { name: PROMETHEUS_URL, value: "http://prometheus-operated.monitoring.svc:9090" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
