apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  # 포털은 상태 없는 정적 사이트 — 2개로 띄우고 평범한 롤링 업데이트
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &labels
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/shinkeonkim/boardgame-portal:latest
          ports:
            - name: http
              containerPort: 8080
            - name: metrics # 내부 전용 Prometheus 지표 (/metrics)
              containerPort: 9464
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
