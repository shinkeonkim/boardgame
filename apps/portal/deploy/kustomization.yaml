# ArgoCD(oh-my-homelab 의 helm-charts/apps/boardgame-portal.yaml)가 이 디렉터리를 kustomize 로 렌더한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boardgame-portal
# 보드게임 전체 대시보드·알림은 포털과 함께 배포 (게임 서버 지표도 여기서 본다)
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- servicemonitor.yaml
- prometheusrule.yaml
configMapGenerator:
- files:
  - boardgame.json=monitoring/boardgame-dashboard.json
  name: boardgame-grafana-dashboard
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
labels:
- pairs:
    app.kubernetes.io/part-of: boardgame
images:
- name: ghcr.io/shinkeonkim/boardgame-portal
  newName: ghcr.io/shinkeonkim/boardgame-portal
  newTag: sha-e7ef166
