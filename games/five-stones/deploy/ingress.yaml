# 공개: Cloudflare Tunnel boardgame.shinkeonkim.com → Traefik → 경로로 나눔 (/five-stones → 이 게임, / → 포털)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: five-stones
spec:
  ingressClassName: traefik
  rules:
    - host: boardgame.shinkeonkim.com
      http:
        paths:
          - path: /five-stones
            pathType: Prefix
            backend:
              service:
                name: five-stones
                port:
                  name: http
