# kube-prometheus-stack이 라벨 제한 없이 모든 ServiceMonitor를 수집한다 (oh-my-homelab values 참고).
# 지표 목록: docs/monitoring.md
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gem-guild
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gem-guild
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
