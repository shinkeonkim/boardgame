# 공개: Cloudflare Tunnel boardgame.shinkeonkim.com → Traefik → 경로로 나눔 (/sealed-letter → 이 게임, / → 포털)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sealed-letter
spec:
  ingressClassName: traefik
  rules:
    - host: boardgame.shinkeonkim.com
      http:
        paths:
          - path: /sealed-letter
            pathType: Prefix
            backend:
              service:
                name: sealed-letter
                port:
                  name: http
