# 공개: Cloudflare Tunnel boardgame.shinkeonkim.com → Traefik → 경로로 나눔 (/number-vault → 이 게임, / → 포털)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: number-vault
spec:
  ingressClassName: traefik
  rules:
    - host: boardgame.shinkeonkim.com
      http:
        paths:
          - path: /number-vault
            pathType: Prefix
            backend:
              service:
                name: number-vault
                port:
                  name: http
