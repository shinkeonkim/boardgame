# 공개: Cloudflare Tunnel boardgame.shinkeonkim.com → Traefik → 경로로 나눔 (/crown-march → 이 게임, / → 포털)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crown-march
spec:
  ingressClassName: traefik
  rules:
    - host: boardgame.shinkeonkim.com
      http:
        paths:
          - path: /crown-march
            pathType: Prefix
            backend:
              service:
                name: crown-march
                port:
                  name: http
