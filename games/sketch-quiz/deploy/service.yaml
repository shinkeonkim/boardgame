apiVersion: v1
kind: Service
metadata:
  name: sketch-quiz
  labels:
    app.kubernetes.io/name: sketch-quiz
spec:
  selector:
    app.kubernetes.io/name: sketch-quiz
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9464
      targetPort: metrics
---
# 무중단 배포용 내부 Service. Ready인 파드(= 교체 전 이전 파드)만 가리키므로
# 새 파드는 이 주소로 자기 자신이 아닌 이전 파드에게서 방 상태를 받아온다. Ingress에는 연결하지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: sketch-quiz-handoff
spec:
  selector:
    app.kubernetes.io/name: sketch-quiz
  ports:
    - name: handoff
      port: 9090
      targetPort: handoff
