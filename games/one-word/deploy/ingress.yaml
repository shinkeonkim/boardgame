# 공개: Cloudflare Tunnel boardgame.shinkeonkim.com → Traefik → 경로로 나눔 (/one-word → 이 게임, / → 포털)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: one-word
spec:
  ingressClassName: traefik
  rules:
    - host: boardgame.shinkeonkim.com
      http:
        paths:
          - path: /one-word
            pathType: Prefix
            backend:
              service:
                name: one-word
                port:
                  name: http
