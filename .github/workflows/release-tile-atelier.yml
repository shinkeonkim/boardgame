name: release tile-atelier
on:
  push:
    branches: [main]
    paths:
      - "games/tile-atelier/**"
      - "!games/tile-atelier/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: tile-atelier
      deploy-dir: games/tile-atelier/deploy
