name: release trio-hunt
on:
  push:
    branches: [main]
    paths:
      - "games/trio-hunt/**"
      - "!games/trio-hunt/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: trio-hunt
      deploy-dir: games/trio-hunt/deploy
