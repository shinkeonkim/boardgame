name: release court-intrigue
on:
  push:
    branches: [main]
    paths:
      - "games/court-intrigue/**"
      - "!games/court-intrigue/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: court-intrigue
      deploy-dir: games/court-intrigue/deploy
