name: release number-runs
on:
  push:
    branches: [main]
    paths:
      - "games/number-runs/**"
      - "!games/number-runs/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: number-runs
      deploy-dir: games/number-runs/deploy
