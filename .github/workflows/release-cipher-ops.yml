name: release cipher-ops
on:
  push:
    branches: [main]
    paths:
      - "games/cipher-ops/**"
      - "!games/cipher-ops/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: cipher-ops
      deploy-dir: games/cipher-ops/deploy
