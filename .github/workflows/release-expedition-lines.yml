name: release expedition-lines
on:
  push:
    branches: [main]
    paths:
      - "games/expedition-lines/**"
      - "!games/expedition-lines/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: expedition-lines
      deploy-dir: games/expedition-lines/deploy
