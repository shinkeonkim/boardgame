name: release hearts
on:
  push:
    branches: [main]
    paths:
      - "games/hearts/**"
      - "!games/hearts/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: hearts
      deploy-dir: games/hearts/deploy
