name: release pass-the-plate
on:
  push:
    branches: [main]
    paths:
      - "games/pass-the-plate/**"
      - "!games/pass-the-plate/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: pass-the-plate
      deploy-dir: games/pass-the-plate/deploy
