name: release row-six
on:
  push:
    branches: [main]
    paths:
      - "games/row-six/**"
      - "!games/row-six/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: row-six
      deploy-dir: games/row-six/deploy
