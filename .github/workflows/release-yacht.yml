name: release yacht
on:
  push:
    branches: [main]
    paths:
      - "games/yacht/**"
      - "!games/yacht/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: yacht
      deploy-dir: games/yacht/deploy
