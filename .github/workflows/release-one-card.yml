name: release one-card
on:
  push:
    branches: [main]
    paths:
      - "games/one-card/**"
      - "!games/one-card/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: one-card
      deploy-dir: games/one-card/deploy
