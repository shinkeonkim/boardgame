name: release sketch-quiz
on:
  push:
    branches: [main]
    paths:
      - "games/sketch-quiz/**"
      - "!games/sketch-quiz/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: sketch-quiz
      deploy-dir: games/sketch-quiz/deploy
