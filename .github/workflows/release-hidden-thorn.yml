name: release hidden-thorn
on:
  push:
    branches: [main]
    paths:
      - "games/hidden-thorn/**"
      - "!games/hidden-thorn/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: hidden-thorn
      deploy-dir: games/hidden-thorn/deploy
