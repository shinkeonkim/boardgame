name: release flag-line
on:
  push:
    branches: [main]
    paths:
      - "games/flag-line/**"
      - "!games/flag-line/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: flag-line
      deploy-dir: games/flag-line/deploy
