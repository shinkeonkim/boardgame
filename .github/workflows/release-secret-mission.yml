name: release secret-mission
on:
  push:
    branches: [main]
    paths:
      - "games/secret-mission/**"
      - "!games/secret-mission/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: secret-mission
      deploy-dir: games/secret-mission/deploy
