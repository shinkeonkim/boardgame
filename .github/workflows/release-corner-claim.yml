name: release corner-claim
on:
  push:
    branches: [main]
    paths:
      - "games/corner-claim/**"
      - "!games/corner-claim/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: corner-claim
      deploy-dir: games/corner-claim/deploy
