name: release domain-tiles
on:
  push:
    branches: [main]
    paths:
      - "games/domain-tiles/**"
      - "!games/domain-tiles/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: domain-tiles
      deploy-dir: games/domain-tiles/deploy
