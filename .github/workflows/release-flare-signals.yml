name: release flare-signals
on:
  push:
    branches: [main]
    paths:
      - "games/flare-signals/**"
      - "!games/flare-signals/deploy/**"
      - "packages/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/bundle.mjs"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      target: flare-signals
      deploy-dir: games/flare-signals/deploy
